<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Pity - IdlePoke</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f0a1c url('https://img.lightshot.app/9AqCovSGQ6CocP0d21PuzQ.png') no-repeat center top fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 55vh;
      padding-bottom: 40px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .calc-container {
      background: rgba(18, 13, 33, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(147, 51, 234, 0.25);
      border-radius: 14px;
      padding: 25px 30px;
      width: 100%;
      max-width: 900px;
      color: #fff;
    }

    .calc-container h2 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 20px;
      color: #e0aaff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    }

    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .calc-grid {
        grid-template-columns: 1fr;
      }
      body {
        padding-top: 45vh;
      }
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #c4b5fd;
    }

    .input-group input[type="text"],
    .input-group input[type="number"], 
    .input-group select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid #5b21b6;
      background: rgba(10, 7, 20, 0.9);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-group select option {
      background: #0a0714;
      color: #fff;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
    }

    /* Linha do Catch Boost e Pokelog perfeitamente nivelados */
    .boost-row {
      display: flex !important;
      gap: 12px !important;
      align-items: stretch !important;
    }

    .boost-row select {
      flex: 1 !important;
      height: 42px !important;
      box-sizing: border-box !important;
    }

    /* Container do Checkbox nivelado na mesma altura e posicao */
    .checkbox-container {
      flex: 1 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 8px !important;
      padding: 0 12px !important;
      background: rgba(10, 7, 20, 0.9) !important;
      border: 1px solid #5b21b6 !important;
      border-radius: 6px !important;
      height: 42px !important;
      box-sizing: border-box !important;
      cursor: pointer !important;
      user-select: none !important;
      margin: 0 !important;
      transition: border-color 0.2s ease !important;
    }

    .checkbox-container:hover {
      border-color: #a855f7 !important;
    }

    /* Reset do checkbox */
    .checkbox-container input[type="checkbox"] {
      -webkit-appearance: checkbox !important;
      appearance: checkbox !important;
      width: 16px !important;
      height: 16px !important;
      min-width: 16px !important;
      margin: 0 !important;
      padding: 0 !important;
      accent-color: #a855f7 !important;
      cursor: pointer !important;
    }

    /* Texto do Pokelog */
    .checkbox-container span {
      font-size: 0.85rem !important;
      color: #c4b5fd !important;
      white-space: nowrap !important;
      line-height: 1 !important;
      display: flex !important;
      align-items: center !important;
    }

    .resultado {
      background: rgba(10, 7, 20, 0.6);
      padding: 18px 20px;
      border-radius: 10px;
      border: 1px dashed rgba(168, 85, 247, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .res-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    .res-item span {
      color: #c4b5fd;
    }

    .res-item strong {
      color: #a7f3d0;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="calc-container">
    <h2>Calculadora de Pity</h2>
    
    <div class="calc-grid">
      <!-- Coluna da Esquerda: Formulario -->
      <div class="inputs-col">
        <div class="input-group">
          <label for="buscar-pokemon">Buscar Pokémon:</label>
          <input type="text" list="pokedex-list" id="buscar-pokemon" placeholder="Digite o nome do Pokémon..." oninput="selecionarPokemon()">
          <datalist id="pokedex-list"></datalist>
        </div>

        <div class="input-group">
          <label for="pokemon">Preço de Venda / Mark ($):</label>
          <input type="number" id="pokemon" value="1050" placeholder="Ex: 1050" oninput="calcular()">
        </div>

        <div class="input-group">
          <label for="bola">Tipo de Pokébola:</label>
          <select id="bola" onchange="calcular()">
            <option value="5" data-cap="15">Poké Ball ($ 5)</option>
            <option value="20" data-cap="20">Great Ball ($ 20)</option>
            <option value="50" data-cap="25">Super Ball ($ 50)</option>
            <option value="130" data-cap="30" selected>Ultra Ball ($ 130)</option>
            <option value="130" data-cap="25">Premier Ball ($ 130)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="buff">Catch Boost:</label>
          <div class="boost-row">
            <select id="buff" onchange="calcular()">
              <option value="1">Nenhum (1.0x)</option>
              <option value="1.5">Boost 1.5x</option>
              <option value="2" selected>Boost 2.0x</option>
              <option value="3">Boost 3.0x</option>
            </select>

            <label class="checkbox-container">
              <input type="checkbox" id="pokelog" onchange="calcular()">
              <span>Pokelog Tier 3 (+5%)</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Coluna da Direita: Resultados -->
      <div class="resultado" id="resultado">
        <div class="res-item">
          <span>Chance por Bola (c/ Buff):</span>
          <strong id="res-chance">0,00%</strong>
        </div>
        <div class="res-item">
          <span>Meta de Gasto (Pity):</span>
          <strong id="res-meta">$ 0</strong>
        </div>
        <div class="res-item">
          <span>Bolas para Ativar Pity:</span>
          <strong id="res-bolas">0 un</strong>
        </div>
        <div class="res-item">
          <span>Custo para Ativar Pity:</span>
          <strong id="res-custo">$ 0</strong>
        </div>
      </div>
    </div>
  </div>

    function carregarDatalist() {
      const datalist = document.getElementById('pokedex-list');
      datalist.innerHTML = '';
      databasePokedex.forEach(item => {
        const option = document.createElement('option');
        option.value = item.nome;
        datalist.appendChild(option);
      });
    }

    function selecionarPokemon() {
      const inputNome = document.getElementById('buscar-pokemon').value;
      const encontrado = databasePokedex.find(p => p.nome.toLowerCase() === inputNome.toLowerCase());
      if (encontrado) {
        document.getElementById('pokemon').value = encontrado.mark;
        calcular();
      }
    }

    function calcular() {
      const pokemon = parseFloat(document.getElementById('pokemon').value);
      const selectBola = document.getElementById('bola');
      const precoBola = parseFloat(selectBola.value);
      const capBola = parseFloat(selectBola.options[selectBola.selectedIndex].getAttribute('data-cap'));
      const multiplicadorBuff = parseFloat(document.getElementById('buff').value);
      const temPokelog = document.getElementById('pokelog').checked;
      
      const multiplicadorPokelog = temPokelog ? 1.05 : 1.0;

      if (!pokemon || !precoBola || pokemon <= 0 || precoBola <= 0) {
        document.getElementById('res-chance').innerText = "0,00%";
        document.getElementById('res-meta').innerText = "$ 0";
        document.getElementById('res-bolas').innerText = "0 un";
        document.getElementById('res-custo').innerText = "$ 0";
        return;
      }

      let chanceBruta = ((precoBola / pokemon) * 50) * multiplicadorBuff * multiplicadorPokelog;
      if (chanceBruta > capBola) {
        chanceBruta = capBola;
      }

      const meta = pokemon * 2;
      const qtdBolas = Math.ceil(meta / precoBola);
      const custo = qtdBolas * precoBola;

      document.getElementById('res-chance').innerText = `${chanceBruta.toFixed(4).replace('.', ',')}%`;
      document.getElementById('res-meta').innerText = `$ ${meta.toLocaleString('pt-BR')}`;
      document.getElementById('res-bolas').innerText = `${qtdBolas.toLocaleString('pt-BR')} un`;
      document.getElementById('res-custo').innerText = `$ ${custo.toLocaleString('pt-BR')}`;
    }

    window.onload = () => {
      carregarDatalist();
      calcular();
    };
